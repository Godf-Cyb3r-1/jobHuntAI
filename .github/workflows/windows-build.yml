name: Windows build and tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --name JobHuntAI --collect-all docx --collect-all pypdf app.py
      - name: Smoke test EXE
        shell: pwsh
        run: |
          $env:JOBHUNTAI_HOME = "$env:RUNNER_TEMP\jh-smoke"
          & .\dist\JobHuntAI.exe health
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Fetch optional native OpenCode v1 runtime
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force opencode-download | Out-Null
          npm pack opencode-windows-x64@1.19.5 --pack-destination opencode-download
          $tarball = Get-ChildItem opencode-download -Filter *.tgz | Select-Object -First 1
          if (-not $tarball) { throw 'OpenCode npm tarball missing' }
          tar -xzf $tarball.FullName -C opencode-download
          $binary = Get-ChildItem opencode-download -Filter opencode.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'No opencode.exe in npm tarball' }
          & $binary.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'OpenCode binary smoke test failed' }
          Copy-Item $binary.FullName opencode-v1.exe
      - name: Native OpenCode v1 server + session + MCP smoke test
        shell: pwsh
        run: |
          python tests/smoke_opencode_runtime.py
      - name: Package portable distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\JobHuntAI.exe package\
          if (Test-Path opencode-v1.exe) { Copy-Item opencode-v1.exe package\opencode.exe }
          Copy-Item README.md,install-windows.ps1,uninstall-windows.ps1,start-server.cmd,start-server.ps1,build-windows.ps1 package\
          Compress-Archive -Path package\* -DestinationPath JobHuntAI-Windows-x64.zip -Force
      - name: Install from portable package and verify scheduled task
        shell: pwsh
        run: |
          & .\package\install-windows.ps1
          $task = Get-ScheduledTask -TaskName JobHuntAI -ErrorAction Stop
          if ($task.State -ne 'Running' -and $task.State -ne 'Ready') { throw "Task state: $($task.State)" }
          $response = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 10
          if (-not $response.ok) { throw "Server returned invalid health: $response" }
          Write-Host "Task registration and web-server health checks passed."
          Stop-ScheduledTask -TaskName JobHuntAI
          Unregister-ScheduledTask -TaskName JobHuntAI -Confirm:$false
      - name: Build setup installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler missing' }
          & $iscc jobhuntai.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          Copy-Item dist-install\JobHuntAI-Setup-Windows-x64.exe .\JobHuntAI-Setup-Windows-x64.exe
      - name: Install setup EXE silently and verify local dashboard
        shell: pwsh
        run: |
          $setup = (Resolve-Path '.\JobHuntAI-Setup-Windows-x64.exe').Path
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exit code $($process.ExitCode)" }
          $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 10
          if (-not $health.ok) { throw "Installed web server health check failed" }
          $task = Get-ScheduledTask -TaskName JobHuntAI -ErrorAction Stop
          Write-Host "Setup executable installed successfully. Scheduled task: $($task.State)."
      - uses: actions/upload-artifact@v4
        with:
          name: JobHuntAI-Windows-x64
          path: |
            JobHuntAI-Windows-x64.zip
            JobHuntAI-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30