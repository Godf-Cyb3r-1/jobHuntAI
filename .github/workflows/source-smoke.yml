name: Live ATS source smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/source_smoke.py'
      - 'backend/app/catalog.py'
      - 'backend/app/core.py'
      - 'backend/app/discovery.py'
      - 'backend/app/smartrecruiters.py'
      - '.github/workflows/source-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Probe configured public ATS endpoints
        run: PYTHONPATH=backend python backend/source_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobhuntai-live-ats-report
          path: source-smoke-report.json
          if-no-files-found: ignore
